webdriver {
  driver = chrome
    chrome {
            webdriver {
                driver = chrome
                autodownload = true
                capabilities {
                  browserName = "chrome"
                  acceptInsecureCerts = true
                  unhandledPromptBehavior = "ignore"
                  "goog:chromeOptions" {
                      args = ["--remote-allow-origins=*","start-maximized","ignore-certificate-errors","--incognito"]
                  }
                  timeouts {
                      implicit = 15000
                      script = 30000
                      pageLoad = 30000
                  }
                }
                wait.for.timeout = 20000
            }
            }
}

headless.mode = false
chrome.switches = """--start-maximized;--test-type;--no-sandbox;--ignore-certificate-errors; --window-size=1920,1080;"""

serenity {
    take.screenshots = AFTER_EACH_STEP
}
